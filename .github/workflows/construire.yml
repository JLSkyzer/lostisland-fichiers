# Construit Lost Island Fichiers pour Windows, macOS et Linux.
# - À chaque push sur main et chaque pull request : vérification, essais et construction seule.
# - À chaque tag vX.Y.Z : publication dans une version GitHub, d'où les logiciels installés se mettent à jour.
name: Construire

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Créer la version GitHub en brouillon (invisible tant que les trois constructions ne sont pas finies)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Lost Island Fichiers $GITHUB_REF_NAME" --notes "Mise à jour du logiciel de transfert."

  construire:
    needs: [version]
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: |
          npm ci
      - name: Vérifier la syntaxe
        shell: bash
        run: |
          for f in src/main/*.js src/preload.js src/renderer/app.js outils/*.js test/*.js; do node --check "$f"; done
      - name: Essais (sans réseau, serveur factice local)
        run: |
          npm run essai
      - name: Construire
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          npx electron-builder --publish never
      - name: Construire et publier
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish always
      - name: Garder les installateurs (constructions sans tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: fichiers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore
          retention-days: 7

  publier:
    needs: [construire]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Rendre la version publique, une fois les trois systèmes envoyés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
